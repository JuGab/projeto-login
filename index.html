<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle,key,mail" />
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/tablet.css" media="screen and (min-width: 768px) and (max-width: 1023px)">
    <link rel="stylesheet" href="estilos/desktop.css" media="screen and (min-width: 1024px)">

</head>
<body>
    
    <div class="container">
        <main>

            <div id="img">

            </div>



            <article>
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form method="post">
                    <fieldset>
                        <div class="data">
                            <label for="iemail"> <span class="material-symbols-outlined icone">account_circle</span></label>
                            <input class="input-data" placeholder="seu e-mail" type="email" name="email" id="iemail">
                        </div>
                        <div class="data">
                            <label for="ipass"><span class="material-symbols-outlined icone">key</span></label>
                            <input class="input-data" placeholder="sua senha" type="password" name="pass" id="ipass">
                        </div>
                        <input class="btn" type="submit" value="Entrar">
                        <div>
                            <input class="btn" id="esquec_pass" type="button" value="Esqueci a senha 🖂">
                        </div>
                    </fieldset>
                </form>
            </article>

            


        </main>
    </div>
</body>
</html>
